[package]
name = "cat-watcher"
version = "1.3.1"
edition = "2021"

[features]
# ダッシュボード（ブラウザでログをリアルタイム表示・localhost HTTP + SSE）を
# 既定で同梱する。スリムにしたい場合は --no-default-features で外せる。
default = ["dashboard"]
# 追加依存は serde_json と tokio/net のみ。
dashboard = ["dep:serde_json", "tokio/net"]

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
regex = "1"
globset = "0.4"
clap = { version = "4.6.0", features = ["derive"] }
chrono = { version = "0.4", features = ["now"] }
notify = { path = "../notify-fork" }
tokio = { version = "1.51.1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "fs", "process", "io-util"] }
blake3 = "1"
walkdir = "2"
colored = "2"
unicode-width = "0.2"
serde_json = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-service = "0.6"
windows-sys = { version = "0.60", features = [
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"