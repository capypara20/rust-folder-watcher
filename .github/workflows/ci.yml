name: CI

# 無駄打ち削減: 毎プッシュでは回さず、PR（作成/更新）と main への push のみで実行する。
# - ブランチへの中間 WIP プッシュでは走らない（PR を開けば検証される）。
# - ドキュメントのみの変更（*.md / doc/）は重いビルド/テストをスキップする。
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'doc/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'doc/**'

permissions:
  contents: read

# 同一ブランチへの連続プッシュ時は古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: テスト (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Rust セットアップ
        uses: dtolnay/rust-toolchain@stable

      - name: cargo キャッシュ
        uses: Swatinem/rust-cache@v2

      # --locked で Cargo.lock と Cargo.toml の不整合を検出する
      - name: テスト実行
        run: cargo test --locked --manifest-path cat-watcher/Cargo.toml

      # dashboard は既定で同梱。--no-default-features の最小ビルドが壊れていないかも検証する
      - name: 最小ビルド確認（--no-default-features）
        run: cargo build --locked --no-default-features --manifest-path cat-watcher/Cargo.toml
