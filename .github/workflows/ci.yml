name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

# 同一ブランチへの連続プッシュ時は古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: テスト (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Rust セットアップ
        uses: dtolnay/rust-toolchain@stable

      - name: cargo キャッシュ
        uses: Swatinem/rust-cache@v2

      # --locked で Cargo.lock と Cargo.toml の不整合を検出する
      - name: テスト実行
        run: cargo test --locked --manifest-path cat-watcher/Cargo.toml

      # 既定ビルドには含まれない dashboard feature もコンパイルを検証する
      - name: ダッシュボード feature ビルド確認
        run: cargo build --locked --features dashboard --manifest-path cat-watcher/Cargo.toml
