name: リリース

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: タグ作成
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      should_release: ${{ steps.tag.outputs.should_release }}

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Cargo.toml からバージョン読み取り
        id: version
        run: |
          VERSION=$(grep '^version' cat-watcher/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: リリースが未作成ならタグを用意
        id: tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${{ steps.version.outputs.version }}`;
            core.setOutput('tag', tag);

            // リリースの有無で判定する（タグの有無で判定すると、タグ作成後に
            // ビルドが失敗した場合、再実行してもスキップされ復旧できないため）
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              console.log(`リリース ${tag} は既に存在するためスキップします。`);
              core.setOutput('should_release', 'false');
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              console.log(`タグ ${tag} を作成しました。`);
            } catch (e) {
              if (e.status !== 422) throw e; // 422 = タグが既に存在
              console.log(`タグ ${tag} は作成済み（リリース未作成）のため続行します。`);
            }
            core.setOutput('should_release', 'true');

  build:
    name: ビルド (${{ matrix.name }})
    needs: tag
    if: needs.tag.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: cat-watcher.exe
            artifact_suffix: windows-x86_64

          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cat-watcher
            artifact_suffix: linux-x86_64

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Rust セットアップ
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cargo キャッシュ
        uses: Swatinem/rust-cache@v2

      - name: リリースバイナリのビルド
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path cat-watcher/Cargo.toml

      - name: アーティファクトのアップロード
        uses: actions/upload-artifact@v4
        with:
          name: cat-watcher-${{ matrix.artifact_suffix }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: GitHub リリース作成
    needs: [tag, build]
    if: needs.tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Windows アーティファクトのダウンロード
        uses: actions/download-artifact@v4
        with:
          name: cat-watcher-windows-x86_64
          path: dist/windows

      - name: Linux アーティファクトのダウンロード
        uses: actions/download-artifact@v4
        with:
          name: cat-watcher-linux-x86_64
          path: dist/linux

      - name: GitHub リリースの作成
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: |
            dist/windows/cat-watcher.exe
            dist/linux/cat-watcher
          generate_release_notes: true
